name: Mirror Letux Linux kernel and report changes

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mirror-letux-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted Retrode3 workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Fetch general Letux kernel and update isolated reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream=https://github.com/goldelico/letux-kernel.git
          upstream_branch=refs/heads/letux-current
          source_ref=refs/remotes/letux/letux-current
          mirror_ref=refs/heads/upstream/letux-current

          # First check the tip without downloading a huge kernel history
          # when Nikolaus has not published anything new.
          current_line=$(git ls-remote --exit-code "$upstream" "$upstream_branch")
          current=$(printf '%s\n' "$current_line" | cut -f1)
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || exit 1

          previous=
          if previous_line=$(git ls-remote --exit-code --heads origin "$mirror_ref"); then
            previous=$(printf '%s\n' "$previous_line" | cut -f1)
            [[ "$previous" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi
          if [ "$current" = "$previous" ]; then
            echo "Letux kernel unchanged: $current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Do not use --filter=blob:none or a shallow --depth=N here!
          # A blobless/shallow tip can be inspected, but pushing it to
          # another, independent GitHub repository needs the missing
          # objects. On this repo, it previously failed with:
          # upload-pack: not our ref / remote unpack: missing object.
          # Unlike the original code, this fetch is complete.
          git fetch --no-tags "$upstream" "+$upstream_branch:$source_ref"
          fetched=$(git rev-parse "$source_ref")
          if [ "$fetched" != "$current" ]; then
            echo "Letux branch changed during fetch; retry in a fresh run" >&2
            exit 1
          fi

          report="$RUNNER_TEMP/letux-kernel-review.md"
          if [ -n "$previous" ]; then
            {
              echo '# Letux Linux: new upstream revision'
              echo
              echo 'Source: goldelico/letux-kernel, branch letux-current'
              printf 'Previous mirror: %s\nCurrent upstream: %s\n' \
                "$previous" "$current"
              echo
              echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$current"
              echo
              echo '## Changes (first 100 commits)'
              echo '~~~text'
              if git cat-file -e "$previous^{commit}" 2>/dev/null; then
                git log --no-merges -n 100 --format='%h %s' \
                  "$previous..$current"
              else
                echo 'Previous tip is not in upstream history; review the complete diff.'
                git log --no-merges -n 30 --format='%h %s' "$current"
              fi
              echo '~~~'
              echo
              if git cat-file -e "$previous^{commit}" 2>/dev/null &&
                 git merge-base --is-ancestor "$previous" "$current"; then
                echo 'Fast-forward detected. Review before integration.'
              else
                echo '**Attention:** upstream history may have diverged or been rewritten.'
                echo 'Review the selected kernel base before any merge.'
              fi
              echo
              echo 'Never merge this mirror into develop/master automatically.'
              echo 'Preserve our Retrode3 driver, DTS/DTSI and kernel config.'
              echo 'Build and hardware-test each kernel update separately.'
            } > "$report"
          fi

          # Push before reporting success. A failed push must not create
          # another duplicate review issue on every nightly retry.
          # --no-thin avoids relying on missing receiver objects.
          if [ -n "$previous" ]; then
            git push --no-thin --force-with-lease="$mirror_ref:$previous" origin \
              "+$source_ref:$mirror_ref"
          else
            git push --no-thin --force-with-lease="$mirror_ref:" origin \
              "+$source_ref:$mirror_ref"
          fi
          echo "Mirror updated: $mirror_ref -> $current" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$previous" ]; then
            title="Review Letux Linux: ${previous:0:12} -> ${current:0:12}"
            # A previous failed implementation could have created an issue
            # before its unsuccessful push. Reuse it rather than duplicating.
            if gh issue list --repo "$GITHUB_REPOSITORY" --state all \
               --limit 100 --search "$title" --json title \
               --jq '.[].title' | grep -Fqx "$title"; then
              echo "Review issue already exists: $title" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --body-file "$report"
            fi
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Initial Letux kernel mirror: no retrospective issue.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
