name: Track Letux Linux upstream SHA and request review

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: track-letux-kernel-tip
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream SHA and update lightweight tracking ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Do not fetch or push the multi-GB kernel object history for
          # a nightly upstream-notification check.
          upstream=https://github.com/goldelico/letux-kernel.git
          remote_ref=refs/heads/letux-current
          tracking_branch=tracking/letux-current
          tracking_file=.github/letux-current.sha

          source_line=$(git ls-remote --exit-code "$upstream" "$remote_ref")
          current=$(printf '%s\n' "$source_line" | cut -f1)
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Unexpected upstream SHA: $current" >&2
            exit 1
          }

          # Small tracking branch. GitHub Contents API creates a server-side
          # commit with one changed SHA file. No kernel Git pack upload.
          meta=$(gh api "repos/$GITHUB_REPOSITORY/contents/$tracking_file?ref=tracking%2Fletux-current")
          blob_sha=$(printf '%s' "$meta" | jq -r '.sha')
          previous=$(printf '%s' "$meta" | jq -r '.content' |
            tr -d '\n' | base64 --decode | tr -d '\r\n')
          [[ "$previous" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid tracking SHA: $previous" >&2
            exit 1
          }
          [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1

          if [ "$current" = "$previous" ]; then
            echo "Letux kernel unchanged: $current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="Review Letux Linux: ${previous:0:12} -> ${current:0:12}"
          report="$RUNNER_TEMP/letux-kernel-review.md"
          {
            echo '# New Letux Linux kernel source revision'
            echo
            echo 'Source: goldelico/letux-kernel, branch letux-current'
            echo
            printf 'Previous observed SHA: %s\nCurrent SHA: %s\n' \
              "$previous" "$current"
            echo
            echo "Old source: https://github.com/goldelico/letux-kernel/commit/$previous"
            echo "New source: https://github.com/goldelico/letux-kernel/commit/$current"
            echo "Compare if histories permit: https://github.com/goldelico/letux-kernel/compare/$previous...$current"
            echo
            echo '**Source-only notification.** No kernel objects have been'
            echo 'copied into DragonBox-Shop/retrode3-kernel. Download the'
            echo 'selected pinned upstream revision from goldelico only'
            echo 'when preparing a reviewed integration branch.'
            echo
            echo 'Keep Retrode3 module, DTS/DTSI and configuration ours.'
            echo 'No automatic merge into develop or master.'
          } > "$report"

          # Reuse an existing issue from the previously failing mirror
          # workflow rather than creating more duplicate review issues.
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all \
             --limit 200 --json title --jq '.[].title' |
             grep -Fqx "$title"; then
            echo "Review issue already exists: $title" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$report"
          fi

          # The blob SHA provides optimistic-concurrency protection.
          # A racing write cannot silently overwrite a newer state.
          encoded=$(printf '%s\n' "$current" | base64 -w0)
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/$tracking_file" \
            -f message="ci: track Letux Linux $current" \
            -f branch="$tracking_branch" \
            -f sha="$blob_sha" \
            -f content="$encoded" >/dev/null

          echo "Tracked Letux kernel: $previous -> $current" >> "$GITHUB_STEP_SUMMARY"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
