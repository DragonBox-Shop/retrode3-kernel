name: Mirror Nikolaus Retrode3 sources and flag updates

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: retrode3-upstream-mirror
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (trusted workflow only)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Compare Nikolaus board sources and update isolated mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Fetch source and local integration for best-effort patch-ID hints.
          # Blob filtering avoids downloading the entire Linux source tree.
          git fetch --no-tags --filter=blob:none --depth=256 origin \
            '+refs/heads/project-retrode3-v2:refs/remotes/source/retrode3' \
            '+refs/heads/develop:refs/remotes/local/develop'

          now=$(git rev-parse refs/remotes/source/retrode3)
          previous=
          if git ls-remote --exit-code --heads origin \
              refs/heads/upstream/nikolaus-retrode3 >/dev/null 2>&1; then
            git fetch --no-tags --filter=blob:none --depth=256 origin \
              '+refs/heads/upstream/nikolaus-retrode3:refs/remotes/mirror/retrode3'
            previous=$(git rev-parse refs/remotes/mirror/retrode3)
          fi

          # These are the Retrode3-owned sources and integration points;
          # never copy them automatically onto develop or master.
          paths=(
            drivers/misc/retrode3
            drivers/misc/Makefile
            drivers/misc/Kconfig
            arch/mips/boot/dts/ingenic/lx16+retrode3.dtsi
            'arch/mips/boot/dts/ingenic/lx16-retrode-*.dts'
            'arch/mips/boot/dts/ingenic/lx16*.dtsi'
            arch/mips/boot/dts/ingenic/lx16.dts
            arch/mips/boot/dts/ingenic/Makefile
            arch/mips/configs/letux_defconfig
            arch/mips/configs/letux_alpha400_defconfig
          )

          if [ -n "$previous" ] && [ "$previous" != "$now" ]; then
            if ! git diff --quiet "$previous" "$now" -- "${paths[@]}"; then
              report="$RUNNER_TEMP/retrode3-upstream-review.md"
              {
                echo '# Nikolaus Retrode3: neue relevante Quellaenderungen'
                echo
                printf 'Quelle: `project-retrode3-v2`\n'
                printf 'Alter Mirror: `%s`\n' "$previous"
                printf 'Neuer Mirror: `%s`\n' "$now"
                echo
                echo "Vergleich: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$now"
                echo
                echo '## Betroffene Dateien'
                echo '~~~text'
                git diff --name-status "$previous" "$now" -- "${paths[@]}"
                echo '~~~'
                echo
                echo '## Neue Commits in den beobachteten Pfaden'
                echo '~~~text'
                git log -n 40 --format='%h %s' "$previous..$now" -- "${paths[@]}" ||
                  echo 'History unavailable (possible shallow boundary/rewrite)'
                echo '~~~'
                echo
                echo '## Patch-ID-Hinweise gegen develop'
                echo 'Git vergleicht hier Patch-Inhalte, nicht nur Commit-IDs.'
                echo 'Ein Minus bedeutet einen patch-aequivalenten Commit in develop;'
                echo 'ein Plus bedeutet nur, dass kein entsprechender Patch gefunden wurde.'
                echo 'Squashes, umgearbeitete und gesplittete Patches erfordern Review.'
                echo '~~~text'
                if git cherry -v refs/remotes/local/develop \
                    refs/remotes/source/retrode3 "$previous" \
                    > "$RUNNER_TEMP/retrode3-cherry.txt" 2>/dev/null; then
                  git log -n 40 --format=%H "$previous..$now" -- "${paths[@]}" |
                    while IFS= read -r commit; do
                      grep -F " $commit " "$RUNNER_TEMP/retrode3-cherry.txt" || true
                    done
                else
                  echo 'Nicht auswertbar (z.B. shallow Git-Historie).'
                fi
                echo '~~~'
                echo
                echo '**Keine automatische Code-Uebernahme.** Ein Maintainer'
                echo 'prueft Diffs, Hardware-Revision, Konflikte und Tests und'
                echo 'erstellt bei Bedarf einen kleinen PR nach develop.'
              } > "$report"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Upstream: Retrode3 source review $(git rev-parse --short "$previous")..$(git rev-parse --short "$now")" \
                --body-file "$report"
            else
              echo 'Keine Aenderungen in Retrode3-spezifischen Pfaden.' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -z "$previous" ]; then
            echo 'Initialer Mirror: keine rueckwirkenden Review-Issues.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Nikolaus Retrode3: keine neuen Commits.' >> "$GITHUB_STEP_SUMMARY"
          fi

          # Advance ONLY the dedicated mirror. A lease prevents a stale run
          # from overwriting a newer mirror update. No merges into releases.
          if [ -n "$previous" ]; then
            git push \
              --force-with-lease="refs/heads/upstream/nikolaus-retrode3:$previous" \
              origin '+refs/remotes/source/retrode3:refs/heads/upstream/nikolaus-retrode3'
          else
            git push \
              --force-with-lease='refs/heads/upstream/nikolaus-retrode3:' \
              origin '+refs/remotes/source/retrode3:refs/heads/upstream/nikolaus-retrode3'
          fi
